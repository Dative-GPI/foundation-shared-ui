name: Publish Package to NPM

on:
  push:
    tags:
      - "*"

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
  
    steps:
      # Checking out repository
      - uses: actions/checkout@v4
      
      
      # Setting .npmrc file up to publish to npm
      - name: Setting things up 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          # User or organization
          scope: '@dative-gpi'
      
      - name: Install and Build 🔧
        run: |
          npm install
          npm run lint
      
      # Workaround Rekor 409 until sigstore-js#1791 reaches lerna:
      # on a 409, reuse the entry our own first attempt created instead of failing
      - name: Patch sigstore 🩹
        run: |
          test -x node_modules/.bin/lerna || { echo "lerna not installed locally, npx would use another copy"; exit 1; }
          files=$(find node_modules -path '*/sigstore/dist/config.js')
          [ -n "$files" ] || { echo "sigstore config.js not found"; exit 1; }
          for f in $files; do
            sed -i 's/fetchOnConflict: false/fetchOnConflict: true/; s/DEFAULT_TIMEOUT = 5000/DEFAULT_TIMEOUT = 30000/' "$f"
            grep -q 'fetchOnConflict: true' "$f" || { echo "patch failed: $f"; exit 1; }
            echo "patched $f"+
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate imports map
        run: |
          cd src/shared/foundation-shared-loader
          python importsGenerator.py

      - name: Build foundation-shared-loader
        run: |
          npm install -w @dative-gpi/foundation-shared-loader
          npm run build -w @dative-gpi/foundation-shared-loader

      # Publishing with tag name as version, one package at a time
      - name: Publishing to npm 🚀
        run: |
          npx lerna publish ${{ github.ref_name }} --exact --no-git-tag-version --yes --no-private --force-publish --concurrency 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}